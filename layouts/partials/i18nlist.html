<div class="dib dropdown-languages mr2">
  <select onchange="location = this.value;" class="pa2 bg-near-black white bn br1 pointer f6">
    <option value="" disabled selected>🌐 {{ .Language.Label | default .Language.Lang }} ({{ i18n "current_lang" }})</option>
    {{ range .Translations }}
    <option value="{{ .RelPermalink }}">
      {{ .Language.Label | default .Language.Lang }}
    </option>
    {{ end }}
  </select>
</div>
