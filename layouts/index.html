{{ define "main" }}
<article class="cf ph3 ph5-l pv2 pv3-l f4 center lh-copy nested-links {{ $.Param "text_color" | default "mid-gray" }}">
  
  {{ partial "hero.html" . }}

  <div class="mw8 center">
    <section class="flex-ns flex-wrap justify-between">
      {{ range .Site.RegularPages }}
        <div class="relative w-100 mb4">
          {{ .Render "summary" }}
        </div>
      {{ end }}
    </section>
  </div>

</article>
{{ end }}
